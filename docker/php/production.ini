memory_limit = 256M

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
; The filesystem is immutable in a container image, so there is nothing to
; revalidate — this is free performance.
opcache.validate_timestamps = 0

expose_php = Off
display_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
