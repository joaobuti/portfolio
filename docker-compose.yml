# One command to a working system: `make up`.
#
# Seven services. The Laravel worker, Python worker and scheduler run as
# separate containers rather than as background
# processes inside the web container — that is how they run in production, and a
# local setup that hides the distinction teaches the wrong mental model.

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    volumes:
      - .:/var/www/html
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      CONTAINER_ROLE: app
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Consumes the billing and observability queues. Scale it with
  # `docker compose up --scale worker=3` — the jobs are unique-while-queued and
  # idempotent, so extra workers are safe.
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    volumes:
      - .:/var/www/html
    environment:
      CONTAINER_ROLE: worker
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Runs `schedule:work`. Exactly one of these, ever — the schedule's
  # onOneServer() lock makes a second one harmless, but there is no reason to
  # have it.
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    volumes:
      - .:/var/www/html
    environment:
      CONTAINER_ROLE: scheduler
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Regional tax and coupon rules, on their own deploy cycle. The billing core
  # calls it synchronously and degrades if it is missing, so `docker compose up
  # --scale pricing=0` is a supported way to see the fallback in action.
  pricing:
    build:
      context: ./services/pricing
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./services/pricing/src:/app/src
    ports:
      - "${PRICING_PORT:-3001}:3000"
    environment:
      PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Scores delinquency risk from PaymentFailed. Consumes a Redis list, not a
  # pub/sub channel — see ADR-0003. Safe to scale: claims are atomic and
  # handling is idempotent by message id.
  risk-worker:
    build:
      context: ./services/risk-worker
      dockerfile: Dockerfile
      target: development
    volumes:
      - ./services/risk-worker/src:/app/src
    environment:
      REDIS_URL: redis://redis:6379/0
      RISK_EVENTS_KEY: risk:events
      RISK_SCORES_KEY: risk:scores
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-billing}
      POSTGRES_USER: ${DB_USERNAME:-billing}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    healthcheck:
      # depends_on with condition: service_healthy is what makes `up` reliable.
      # Without it the app races the database and fails on first boot roughly
      # half the time, which is the single most common "it doesn't work on my
      # machine" report for a compose stack.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-billing} -d ${DB_DATABASE:-billing}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
